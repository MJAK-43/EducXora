name: eduxora

x-app-service: &app-service
    build:
        context: .
        target: development
        args:
            APP_UID: ${APP_UID:-1000}
            APP_GID: ${APP_GID:-1000}
    env_file:
        - .env
    volumes:
        - ./:/var/www/html
        - composer_vendor:/var/www/html/vendor
        - app_storage:/var/www/html/storage
        - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
        - eduxora_internal
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
    restart: unless-stopped

services:
    app:
        <<: *app-service
        healthcheck:
            test: ['CMD-SHELL', 'php-fpm -t 2>/dev/null']
            interval: 10s
            timeout: 5s
            retries: 5

    queue:
        <<: *app-service
        command: php artisan queue:work --sleep=2 --tries=3 --timeout=90
        healthcheck:
            test: ['CMD-SHELL', 'php artisan queue:monitor default --max=100 >/dev/null 2>&1']
            interval: 30s
            timeout: 10s
            retries: 3

    scheduler:
        <<: *app-service
        command: php artisan schedule:work

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - eduxora_internal
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/up || exit 1']
            interval: 10s
            timeout: 5s
            retries: 6
        restart: unless-stopped

    node:
        image: node:24-alpine
        working_dir: /var/www/html
        command: sh -c "npm ci --no-audit --no-fund && npm run dev"
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules
        networks:
            - eduxora_internal
        restart: unless-stopped

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-eduxora}
            POSTGRES_USER: ${DB_USERNAME:-eduxora}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-eduxora_local_only}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
        networks:
            - eduxora_internal
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-eduxora} -d ${DB_DATABASE:-eduxora}']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7.4-alpine
        command: redis-server --appendonly yes --maxmemory-policy noeviction
        volumes:
            - redis_data:/data
        networks:
            - eduxora_internal
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:v1.27
        ports:
            - '${MAILPIT_PORT:-8025}:8025'
        networks:
            - eduxora_internal
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

networks:
    eduxora_internal:
        driver: bridge

volumes:
    app_storage:
    bootstrap_cache:
    composer_vendor:
    node_modules:
    postgres_data:
    redis_data:
